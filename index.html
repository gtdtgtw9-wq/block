<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>画像出現ブロック崩し</title>
<link rel="stylesheet" href="style.css">

<!-- PWA対応（v0.31〜、v0.31追記でアイコン・起動画面を追加） -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ブロック崩し">

<!-- iOSホーム画面アイコン -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">

<!-- iOS起動画面（縦） -->
<link rel="apple-touch-startup-image" href="splash/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash/splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
<!-- iPhone XR / 11（対象端末） -->
<link rel="apple-touch-startup-image" href="splash/splash-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)">
<link rel="apple-touch-startup-image" href="splash/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">

<!-- iOS起動画面（横。本アプリはportrait固定運用のため参考程度） -->
<link rel="apple-touch-startup-image" href="splash/splash-wide-2796x1290.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)">
<link rel="apple-touch-startup-image" href="splash/splash-wide-2532x1170.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)">
<link rel="apple-touch-startup-image" href="splash/splash-wide-1792x828.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
</head>
<body>

  <div id="game-wrap">
    <canvas id="gameCanvas"></canvas>

    <!-- 右上ハンバーガーメニュー -->
    <button id="menuBtn" aria-label="メニュー">
      <span></span><span></span><span></span>
    </button>

    <!-- タップでスタート/再開の案内 -->
    <div id="tapHint">タップしてスタート</div>
  </div>

  <!-- 情報パネル -->
  <div id="panel" class="hidden">
    <div class="panel-inner">
      <h2>情報</h2>
      <div class="panel-row"><span>ステージ</span><strong id="panelStage">1</strong></div>
      <div class="panel-row"><span>スコア</span><strong id="panelScore">0</strong></div>
      <div class="panel-row"><span>残機</span><strong id="panelLife">●●●</strong></div>

      <div class="panel-divider"></div>

      <h3 class="panel-subheading">ステージ画像</h3>
      <button type="button" id="openStageImageTabBtn" class="panel-button panel-button--outline">ステージ画像を変更</button>
      <input type="file" id="imageInput" accept="image/*" hidden>

      <div class="panel-divider"></div>

      <h3 class="panel-subheading">周辺装飾（マット）画像</h3>
      <button type="button" id="openMatImageTabBtn" class="panel-button panel-button--outline">周辺装飾（マット）画像を変更</button>
      <input type="file" id="matImageInput" accept="image/*" hidden>

      <div class="panel-divider"></div>

      <h3 class="panel-subheading">ボールの見た目</h3>
      <div class="ball-shape-list" id="ballShapeList">
        <button type="button" class="ball-shape-btn" data-shape="circle" aria-label="円形">●</button>
        <button type="button" class="ball-shape-btn" data-shape="spade" aria-label="スペード">♠</button>
        <button type="button" class="ball-shape-btn" data-shape="heart" aria-label="ハート">♥</button>
        <button type="button" class="ball-shape-btn" data-shape="diamond" aria-label="ダイヤ">♦</button>
        <button type="button" class="ball-shape-btn" data-shape="club" aria-label="クラブ">♣</button>
      </div>

      <div class="panel-divider"></div>

      <h3 class="panel-subheading">ボールの色</h3>
      <div class="ball-color-row">
        <input type="color" id="ballColorInput" value="#f4f2ec">
        <span class="ball-color-label">タップして色を選択</span>
      </div>

      <div class="panel-divider"></div>

      <!-- リセット系ボタン：1箇所にまとめ、▼でその他のリセットを展開表示 -->
      <div class="reset-group">
        <div class="reset-group__row">
          <button id="resetStageBtn" class="panel-button panel-button--danger reset-group__main">ステージ進行をリセット</button>
          <button id="resetToggleBtn" class="reset-group__toggle" type="button" aria-label="その他のリセットを表示" aria-expanded="false">▼</button>
        </div>
        <div id="resetExtra" class="reset-group__extra hidden">
          <button id="resetImagesBtn" class="panel-button panel-button--danger">画像をすべてリセット</button>
          <button id="resetMatImagesBtn" class="panel-button panel-button--danger">周辺装飾画像をすべてリセット</button>
        </div>
      </div>

      <button id="panelCloseBtn" class="panel-button panel-button--ghost">閉じる</button>
    </div>
  </div>
  <div id="panelOverlay" class="hidden"></div>

  <!-- 画像変更タブ：ステージ画像（グリッド一覧） -->
  <div id="stageImageTab" class="image-tab hidden">
    <div class="image-tab__header">
      <button type="button" id="stageImageTabCloseBtn" class="image-tab__close" aria-label="閉じる">←</button>
      <h2>ステージ画像</h2>
    </div>
    <div id="stageImageGrid" class="image-grid"></div>
  </div>

  <!-- 画像変更タブ：周辺装飾（マット）画像（グリッド一覧） -->
  <div id="matImageTab" class="image-tab hidden">
    <div class="image-tab__header">
      <button type="button" id="matImageTabCloseBtn" class="image-tab__close" aria-label="閉じる">←</button>
      <h2>周辺装飾（マット）画像</h2>
    </div>
    <div id="matImageGrid" class="image-grid"></div>
  </div>

  <!-- ステージクリア モーダル -->
  <div id="clearModal" class="modal hidden">
    <div class="modal-box">
      <p class="modal-title">ステージクリア!</p>
      <p class="modal-sub" id="clearStageLabel"></p>
      <button id="nextStageBtn" class="modal-button">次のステージへ</button>
    </div>
  </div>

  <!-- ゲームオーバー モーダル -->
  <div id="overModal" class="modal hidden">
    <div class="modal-box">
      <p class="modal-title">ゲームオーバー</p>
      <p class="modal-sub" id="overScoreLabel"></p>
      <button id="retryBtn" class="modal-button">もう一度</button>
    </div>
  </div>

<!--
  ファイル分割（Backlog対応）：以下の順序に依存関係があるため、この順番を変更しないこと。
  config.js → state.js → game.js → ui.js → main.js
  詳細は 01_CURRENT.md / 04_CHANGELOG.md 参照
-->
<script src="config.js"></script>
<script src="state.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
